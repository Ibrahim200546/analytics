version: "3.3"

services:
    database:
        image: postgres:13-alpine
        ports:
            - "${DATABASE_PORT}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
        volumes:
            - db-data:/var/lib/postgresql/data:rw
        networks:
            - exchange-rates

    frontend:
        build:
            dockerfile: docker/frontend/dev.Dockerfile
            context: .
            args:
                LINUX_USER_ID: ${LINUX_USER_ID}
        ports:
            - "${FRONTEND_PORT}:3000"
        volumes:
            - ./frontend:/srv/app
            - .env:/srv/app/.env.local
        command: yarn run dev
        networks:
            - exchange-rates

    php:
        build:
            context: .
            dockerfile: docker/php/stage.Dockerfile
            args:
                LINUX_USER_ID: ${LINUX_USER_ID}
        environment:
            XDEBUG_CONFIG: client_host=${XDEBUG_REMOTE_HOST} client_port=${XDEBUG_REMOTE_PORT}
            PHP_IDE_CONFIG: serverName=${IDE_SERVER_NAME}
        volumes:
            - ./backend/:/srv/app
            - ./.env:/srv/app/.env
        depends_on:
            - database
        networks:
            - exchange-rates

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/dev.Dockerfile
            args:
                NGINX_PORT: ${BACKEND_PORT}
        volumes:
            - ./backend/public/:/srv/app/public
        depends_on:
            - php
        ports:
            - ${BACKEND_PORT}:${BACKEND_PORT}
        networks:
            - exchange-rates

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        environment:
            discovery.type: single-node
            bootstrap.memory_lock: "true"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - es-data:/usr/share/elasticsearch/data:rw
        ports:
            - "${ELASTICSEARCH_PORT}:9200"
        networks:
            - exchange-rates

networks:
    exchange-rates:

volumes:
    db-data:
    es-data:
