services:
    database:
        image: postgres:13-alpine
        ports:
            - "${DATABASE_PORT}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
        volumes:
            - db-data:/var/lib/postgresql/data:rw
        networks:
            - exchange-rates
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready"]
            interval: 10s
            timeout: 5s
            retries: 5

    frontend:
        build:
            dockerfile: docker/frontend/dev.Dockerfile
            context: .
            args:
                LINUX_USER_ID: ${LINUX_USER_ID}
        ports:
            - "${FRONTEND_PORT}:3000"
        volumes:
            - ./frontend:/srv/app
            - .env:/srv/app/.env.local:ro
        command: yarn run dev
        networks:
            - exchange-rates
        depends_on:
            nginx:
                condition: service_started
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5

    php:
        build:
            context: .
            dockerfile: docker/php/stage.Dockerfile
            args:
                LINUX_USER_ID: ${LINUX_USER_ID}
        environment:
            XDEBUG_CONFIG: client_host=${XDEBUG_REMOTE_HOST} client_port=${XDEBUG_REMOTE_PORT}
            PHP_IDE_CONFIG: serverName=${IDE_SERVER_NAME}
        volumes:
            - ./backend/:/srv/app
            - ./.env:/srv/app/.env:ro
        depends_on:
            database:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        networks:
            - exchange-rates
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true

    nginx:
        build:
            context: .
            dockerfile: docker/nginx/dev.Dockerfile
            args:
                NGINX_PORT: ${BACKEND_PORT}
        volumes:
            - ./backend/public/:/srv/app/public:ro
        depends_on:
            php:
                condition: service_started
        ports:
            - "${BACKEND_PORT}:${BACKEND_PORT}"
        networks:
            - exchange-rates
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:${BACKEND_PORT}/healthz || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 5

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        environment:
            discovery.type: single-node
            bootstrap.memory_lock: "true"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - es-data:/usr/share/elasticsearch/data:rw
        ports:
            - "${ELASTICSEARCH_PORT}:9200"
        networks:
            - exchange-rates
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
            interval: 20s
            timeout: 10s
            retries: 10

networks:
    exchange-rates:

volumes:
    db-data:
    es-data:
