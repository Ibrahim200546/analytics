parameters:
    file.paths.public_dir: '%kernel.project_dir%/public'
    file.ran_locally: true

services:
    Dexodus\FileBundle\:
        resource: '../..'
        public: true
        autowire: true
        autoconfigure: true
        exclude:
            - '../../Entity/'
            - '../../Event/'
            - '../../Exception/'

    Dexodus\FileBundle\FieldGenerator\:
        resource: '../../FieldGenerator'
        public: true
        autowire: true
        autoconfigure: true
        tags: ['entity_form.field_generator']

    Aws\S3\S3Client:
        bind:
            $args:
                version: 'latest'
                region: '%env(AWS_S3_REGION)%'
                credentials:
                    key: '%env(AWS_S3_KEY)%'
                    secret: '%env(AWS_S3_SECRET)%'
                endpoint: '%env(AWS_S3_ENDPOINT)%'
                use_path_style_endpoint: true
