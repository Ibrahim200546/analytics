lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 2678400 # 31 день * 24 часа * 60 минут * 60 секунд

    token_extractors:
        authorization_header:
            enabled: true
            prefix:  Bearer
            name:    Authorization
        query_parameter:
            enabled: true
            name:    access_token
