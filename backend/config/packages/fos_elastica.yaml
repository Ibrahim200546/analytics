fos_elastica:
    clients:
        default: { url: '%env(ELASTICSEARCH_URL)%' }
    indexes:
        articles:
            settings:
                index:
                    max_result_window: 1000000
            properties:
                title:
                    type: text
                    analyzer: standard
                content:
                    type: text
                    analyzer: standard
                announce:
                    type: text
                    analyzer: standard
            persistence:
                driver: orm
                model: Dexodus\SmiParserBundle\Entity\Article
                provider: ~
                finder: ~
                listener:
                    insert: true
                    update: true
                    delete: true
