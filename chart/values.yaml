crontab:
  - article:parse-new
  - articles:distribute

worker:
  enabled: true
#  replicas: 64
  replicas: 0
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  command:
    - php
    - /srv/app/bin/console
    - messenger:consume
    - async
    - --time-limit=3600
    - --memory-limit=128M
