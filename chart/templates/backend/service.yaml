apiVersion: v1
kind: Service
metadata:
    name: exchange-rates-{{ .Values.env }}-backend-service
    labels:
        env: {{ .Values.env }}
        type: exchange-rates-{{ .Values.env }}-backend-service
spec:
    selector:
        env: {{ .Values.env }}
        type: exchange-rates-{{ .Values.env }}-backend
    ports:
        -   name: web
            protocol: TCP
            port: 80
            targetPort: 8080
