apiVersion: apps/v1
kind: Deployment
metadata:
    name: exchange-rates-{{ .Values.env }}-frontend-deployment
    labels:
        env: {{ .Values.env }}
        type: exchange-rates-{{ .Values.env }}-frontend-deployment
spec:
    replicas: {{ .Values.frontend.replicas }}
    selector:
        matchLabels:
            env: {{ .Values.env }}
            type: exchange-rates-{{ .Values.env }}-frontend
    template:
        metadata:
            labels:
                env: {{ .Values.env }}
                type: exchange-rates-{{ .Values.env }}-frontend
        spec:
            automountServiceAccountToken: false
            dnsPolicy: ClusterFirst
            imagePullSecrets:
                - name: {{ .Values.imagePullSecret }}
            securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                fsGroup: 1000
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: exchange-rates-frontend
                  image: "registry.gitlab.com/dexodus-group/exchange-rates/frontend-{{ .Values.env }}:{{ .Values.image.tag }}"
                  imagePullPolicy: IfNotPresent
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop: ["ALL"]
                  resources:
                      {{- toYaml .Values.frontend.resources | nindent 22 }}
                  {{- if .Values.existingSecret }}
                  envFrom:
                      - secretRef:
                            name: {{ .Values.existingSecret }}
                  {{- end }}
                  ports:
                      - containerPort: 3000
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 6
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
