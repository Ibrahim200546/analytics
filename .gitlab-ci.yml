Deploy In Production Environment:
    stage: deploy
    rules:
        -   if: $CI_COMMIT_BRANCH == "main"
            when: manual
    image: dtzar/helm-kubectl:3.9.4
    script:
        - kubectl config use-context dexodus-group/exchange-rates:exchange-rates
        - helm upgrade exchange-rates -n default ./chart/ -f ./chart/prod_values.yaml --set image.tag=${IMAGE_TAG} --install

