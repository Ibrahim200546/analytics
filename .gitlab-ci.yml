image: docker:20.10.16

variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}

Build Backend PHP:
    services:
        - docker:dind
    cache:
        paths:
            - backend/vendor/
    stage: build
    parallel:
        matrix:
            - ENVIRONMENT: 'prod'
              PROJECT_ENVIRONMENT: $PROJECT_ENVIRONMENT_PROD
    rules:
        -   if: $CI_COMMIT_BRANCH == "main"
    script:
        - echo "$PROJECT_ENVIRONMENT" > .env
        - docker login $REGISTRY_URL -u $REGISTRY_USER -p $REGISTRY_PASSWORD
        - docker build -f docker/php/prod.Dockerfile -t $REGISTRY_IMAGE_PREFIX/backend-php-${ENVIRONMENT}:${IMAGE_TAG} --build-arg ENVIRONMENT=${ENVIRONMENT} .
        - docker push $REGISTRY_IMAGE_PREFIX/backend-php-${ENVIRONMENT}:${IMAGE_TAG}

Build Backend Nginx:
    services:
        - docker:dind
    stage: build
    rules:
        -   if: $CI_COMMIT_BRANCH == "main"
    script:
        - docker login $REGISTRY_URL -u $REGISTRY_USER -p $REGISTRY_PASSWORD
        - docker build -f docker/nginx/prod.Dockerfile -t $REGISTRY_IMAGE_PREFIX/backend-nginx:${IMAGE_TAG} --build-arg NGINX_PORT=80 .
        - docker push $REGISTRY_IMAGE_PREFIX/backend-nginx:${IMAGE_TAG}
        - 'echo "Docker image: ${REGISTRY_IMAGE_PREFIX}/backend-nginx:${IMAGE_TAG}"'

